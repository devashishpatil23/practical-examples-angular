<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h2 mb-0">Items List</h1>
    
    <!-- Category Filter -->
    <div class="d-flex align-items-center gap-2">
      <div style="min-width: 200px;">
        <select 
          class="form-select form-select-sm"
          [(ngModel)]="selectedCategory" 
          (change)="onCategoryChange()"
        >
          <option value="">All Categories</option>
          <option *ngFor="let category of categories" [value]="category">
            {{ category }}
          </option>
        </select>
      </div>
      
      <!-- Clear Filter Button -->
      <button 
        *ngIf="hasActiveFilters"
        (click)="clearAllFilters()"
        class="btn btn-sm btn-outline-secondary"
        title="Clear category filter"
      >
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  </div>
  
  <!-- Items Grid -->
  <div *ngIf="items$ | async as items; else loading" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    <div *ngFor="let item of items" class="col">
      <div class="card h-100">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <h5 class="card-title mb-0">{{ item.name }}</h5>
            <span class="badge bg-primary">{{ item.category }}</span>
          </div>
          <p class="card-text text-muted small">{{ item.description }}</p>
        </div>
        <div class="card-footer bg-transparent">
          <div class="d-flex justify-content-between align-items-center">
            <span class="h5 mb-0 text-primary">${{ item.price }}</span>
            <small class="text-muted">{{ item.createdAt | date:'mediumDate' }}</small>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Loading State -->
  <ng-template #loading>
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-2 text-muted">Loading items...</p>
    </div>
  </ng-template>
  
  <!-- Empty State -->
  <div *ngIf="(items$ | async)?.length === 0" class="text-center py-5">
    <div class="alert alert-info">
      <i class="bi bi-info-circle me-2"></i>
      No items found in this category.
    </div>
    <button 
      (click)="clearAllFilters()"
      class="btn btn-outline-primary btn-sm"
    >
      Show all items
    </button>
  </div>
</div>
