<div class="container">
  <ul class="list-group">
    @for (todo of list; track $index) {
    <li
      class="list-group-item d-flex justify-content-between align-items-center"
    >
      <div class="d-flex align-items-center">
        <input
          [checked]="todo.checked"
          (change)="onChecked(todo)"
          class="form-check-input me-2"
          type="checkbox"
        />
        <span class="me-3">{{ todo.todo }}</span>
        <span class="badge bg-info text-dark"
          >Priority: {{ todo.priority }}</span
        >
      </div>
      <div>
        <button (click)="onEdit(todo)" class="btn btn-sm btn-primary me-2">
          Edit
        </button>
        <button (click)="onDelete(todo)" class="btn btn-sm btn-danger">
          Delete
        </button>
      </div>
    </li>
    }
  </ul>
</div>
